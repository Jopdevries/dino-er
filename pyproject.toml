[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dino-er"
version = "0.3.0"
description = "AE4350 study of learning and internal-state use in reactive and recurrent Chromium Dino controllers"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Jop de Vries" }]
dependencies = [
  "matplotlib>=3.10,<4",
  "numpy>=2.0,<3",
  "pillow>=11,<13",
  "playwright>=1.61,<2",
  "pyarrow>=20,<24",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]
cuda = [
  "torch>=2.13,<2.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dino_er"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  "artifacts",
  "results",
  "third_party",
  "tmp",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["third_party", "artifacts", "results", "tmp"]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
